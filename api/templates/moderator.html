<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderator — EditH</title><style>
:root{--bg:#03070c;--panel:#071019;--red:#ff2038;--text:#f4f7fb;--muted:#8f9baa;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,rgba(255,32,56,.1),transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(3,7,12,.9);backdrop-filter:blur(18px);z-index:5}.brand img{height:48px;width:180px;object-fit:contain}.btn{border:1px solid var(--line);background:#0a121a;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}.btn:hover{border-color:rgba(255,32,56,.6)}.red{background:linear-gradient(135deg,#ff3147,#e70d27);border-color:#ff3147}.main{width:min(1450px,calc(100% - 32px));margin:auto;padding:30px 0 70px}.card{background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:16px;padding:22px}.k{font-size:10px;letter-spacing:.2em;color:var(--red);font-weight:900}.muted{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.server{display:flex;gap:13px;align-items:center;cursor:pointer}.server:hover{border-color:rgba(255,32,56,.55)}.server img{width:55px;height:55px;border-radius:15px;object-fit:cover}.meta{min-width:0}.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;margin:6px 4px 0 0;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.06);font-size:10px;color:#aeb8c2}.badge.red{background:rgba(255,32,56,.12);color:#ff7a88}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.input,.select{background:#070d13;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}.table th{font-size:10px;color:#77828e;text-transform:uppercase}.empty{text-align:center;padding:50px;color:#687480}.error{padding:14px;border-radius:10px;border:1px solid rgba(255,32,56,.4);color:#ff9aa4;background:rgba(255,32,56,.08)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.main{width:min(100% - 20px,1450px)}.nav{padding:0 14px}}
</style></head><body><header class="nav"><a class="brand" href="/"><img src="/static/anion-logo.png" alt="EditH"></a><a class="btn" href="/logout">Logout</a></header><main class="main"><section class="card"><div class="k">MODERATOR CONTROL</div><h1>Administrated servers</h1><p class="muted">This list comes from your Discord OAuth guild permissions and is intersected with servers where EditH is actually installed. Actions are rechecked by Railway against Discord.</p></section><section id="servers" class="grid"></section><section id="panel" style="margin-top:16px"></section></main><script>
let guilds=[],selected=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function adminish(g){try{let p=BigInt(g.permissions||0);return g.owner||g.is_owner||g.is_admin||(p&8n)!==0n||(p&32n)!==0n||(p&2n)!==0n||(p&4n)!==0n||(p&8192n)!==0n||(p&1099511627776n)!==0n}catch{return false}}
async function load(){try{let r=await fetch('/api/guilds'),x=await r.json();if(!r.ok)throw Error(x.error||'Could not load Discord guild data');guilds=(x.guilds||[]).filter(g=>g.bot_present&&adminish(g));document.getElementById('servers').innerHTML=guilds.map(g=>`<article class="card server" onclick="openGuild('${g.id}')"><img src="${g.icon||'/static/planet.jpg'}"><div class="meta"><b>${esc(g.name)}</b><span class="badge red">EditH installed</span><span class="badge">${g.is_owner?'Owner':'Moderator/Manager'}</span><span class="badge">${Number(g.member_count||0).toLocaleString()} members</span></div></article>`).join('')||'<div class="empty">No administrated EditH servers found. Re-authorize with the guilds scope if your server permissions changed.</div>'}catch(e){document.getElementById('servers').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function openGuild(id){let r=await fetch('/api/guild/'+id);let x=await r.json();if(!r.ok)return alert(x.error||'Could not load server');selected=x.guild;render()}
function render(){let g=selected,m=(g.members||[]).slice(0,250);document.getElementById('panel').innerHTML=`<div class="card"><div class="k">${esc(g.name)}</div><h2>Moderation control</h2><div class="toolbar"><input id="uid" class="input" placeholder="Member/User ID"><input id="reason" class="input" placeholder="Reason"><input id="duration" class="input" type="number" value="60" min="1"><button class="btn red" onclick="act('ban')">Ban</button><button class="btn red" onclick="act('kick')">Kick</button><button class="btn" onclick="act('mute')">Mute</button><button class="btn" onclick="act('unmute')">Unmute</button><button class="btn" onclick="act('warn')">Warn</button><button class="btn" onclick="act('unban')">Unban</button><button class="btn red" onclick="act('mute_all')">Mute All</button><button class="btn" onclick="warnings()">Warnings</button></div><div class="toolbar"><select id="roleSelect" class="select"><option value="">Choose role…</option>${(g.roles||[]).filter(r=>!r.managed&&r.name!='@everyone').map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="btn" onclick="act('assign_role')">Give role</button><button class="btn" onclick="act('unassign_role')">Remove role</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Member</th><th>ID</th><th>Roles</th><th>Admin</th></tr></thead><tbody>${m.map(x=>`<tr><td>${esc(x.display_name)}</td><td>${x.id}</td><td>${(x.roles||[]).map(r=>esc(r.name)).join(', ')||'—'}</td><td>${x.is_admin?'YES':'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
async function act(a){let id=(document.getElementById('uid')?.value||'').trim();if(!id&&a!=='mute_all')return alert('Enter a member/user ID');let p={guild_id:selected.id,user_id:id,reason:document.getElementById('reason')?.value||'',duration:Number(document.getElementById('duration')?.value||60)};if(a==='assign_role'||a==='unassign_role'){p.role_id=document.getElementById('roleSelect').value;if(!p.role_id)return alert('Choose a role')}let r=await fetch('/api/action/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),x=await r.json();alert(x.ok?'Action completed':(x.error||'Action failed'));if(x.ok)openGuild(selected.id)}async function warnings(){let id=document.getElementById('uid').value.trim();if(!id)return alert('Enter a member ID');let r=await fetch('/api/warnings/'+selected.id+'/'+id),x=await r.json();alert((x.warnings||[]).map(w=>`${w.created_at}\n${w.reason}\nModerator: ${w.moderator_id}`).join('\n\n')||'No warnings')}
load();</script></body></html>
