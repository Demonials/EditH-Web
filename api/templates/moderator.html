<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderator — EditH</title><style>
:root{--bg:#03070c;--panel:#071019;--red:#ff2038;--text:#f4f7fb;--muted:#8f9baa;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}a{color:inherit;text-decoration:none}.dash{min-height:100vh;background:radial-gradient(circle at 80% 0%,rgba(255,32,56,.08),transparent 35%),#03070c}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5;background:rgba(3,7,12,.9);backdrop-filter:blur(15px)}.brand img{width:190px;height:55px;object-fit:contain;object-position:left}.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#0b121a;color:#fff;cursor:pointer}.btn:hover{border-color:rgba(255,32,56,.7)}.red{background:#e9152d;border-color:#ff3147}.danger{color:#ff8793;border-color:rgba(255,32,56,.35)}.success{color:#71e4ad;border-color:rgba(50,210,130,.35)}.small{font-size:11px;padding:7px 10px}.main{width:min(1350px,calc(100% - 28px));margin:auto;padding:28px 0}.card{background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:16px;padding:21px}.kicker{font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--red)}h1,h2{margin:7px 0}.muted{color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat b{display:block;font-size:25px}.stat span{font-size:10px;color:#77828f}.servers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.server{display:flex;gap:12px;align-items:center;cursor:pointer}.server:hover{border-color:rgba(255,32,56,.5)}.server img{width:52px;height:52px;border-radius:14px;object-fit:cover}.meta{min-width:0}.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;margin:4px 4px 0 0;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.06);font-size:9px;color:#aab3bd}.badge.red{background:rgba(255,32,56,.12);color:#ff7480}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.input,.toolbar select,.toolbar textarea{background:#070d13;color:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:0}.input:focus,.toolbar select:focus,.toolbar textarea:focus{border-color:var(--red)}.panel{margin-top:15px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);font-size:11px}.table th{font-size:9px;color:#75808c;text-transform:uppercase;letter-spacing:.08em}.empty{text-align:center;padding:45px;color:#697581}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;place-items:center;padding:18px}.modal.show{display:grid}.modalbox{width:min(600px,100%);max-height:85vh;overflow:auto}.member-actions{display:flex;gap:6px;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.servers{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:560px){.nav{padding:0 14px}.brand img{width:150px}.servers{grid-template-columns:1fr}.main{width:min(100% - 20px,1350px)}}
</style></head><body class="dash"><header class="nav"><a class="brand" href="/"><img src="/static/anion-logo.png" alt="EditH"></a><div><span class="badge red">MODERATOR</span> <a class="btn small" href="/logout">Logout</a></div></header><main class="main"><section class="card"><div class="kicker">MODERATOR DASHBOARD</div><h1 id="welcome">Loading…</h1><p class="muted">Real Discord data. Moderation controls are available only for servers where your Discord account has the required permissions.</p></section><section class="stats"><div class="card stat"><b id="serverCount">—</b><span>ADMIN SERVERS</span></div><div class="card stat"><b id="memberCount">—</b><span>MEMBERS</span></div><div class="card stat"><b id="role">MODERATOR</b><span>ACCESS</span></div><div class="card stat"><b>LIVE</b><span>DISCORD DATA</span></div></section><section class="card"><div class="kicker">YOUR SERVERS</div><h2>Choose a server</h2><div id="servers" class="servers"></div></section><section id="panel" class="panel"></section></main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox card"><div class="kicker">WARNINGS</div><h2 id="modalTitle">Warning history</h2><div id="modalBody" class="muted"></div><div class="toolbar"><button class="btn" onclick="closeModal()">Close</button></div></div></div><script>
let guilds=[],selected=null,me=null;async function getJSON(url,opts){let r=await fetch(url,opts);let x=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw new Error(x.error||x.detail||('HTTP '+r.status));return x}async function load(){try{me=await getJSON('/api/me');document.getElementById('welcome').textContent='Welcome, '+(me.user?.profile?.global_name||me.user?.profile?.username||me.user?.username||'Moderator');guilds=(await getJSON('/api/guilds')).guilds||[];guilds=guilds.filter(g=>g.is_admin||g.is_owner);document.getElementById('serverCount').textContent=guilds.length;document.getElementById('memberCount').textContent=guilds.reduce((n,g)=>n+(Number(g.member_count)||0),0).toLocaleString();renderServers()}catch(e){document.getElementById('servers').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}function renderServers(){document.getElementById('servers').innerHTML=guilds.map(g=>`<article class="card server" onclick="openGuild('${g.id}')"><img src="${g.icon||'/static/planet.jpg'}"><div class="meta"><b>${esc(g.name)}</b><span class="badge red">${g.is_owner?'OWNER':'ADMIN'}</span><span class="badge">${Number(g.member_count||0).toLocaleString()} members</span><span class="badge">${g.channels||0} channels</span></div></article>`).join('')||'<div class="empty">No administrated mutual servers found.</div>'}async function openGuild(id){try{let x=await getJSON('/api/guild/'+id);selected=x.guild;render()}catch(e){alert(e.message)}}function render(){let g=selected,m=g.members||[],roles=(g.roles||[]).filter(r=>!r.managed&&r.name!='@everyone');document.getElementById('panel').innerHTML=`<div class="card"><div class="kicker">SELECTED SERVER</div><h2>${esc(g.name)}</h2><div class="stats"><div class="card stat"><b>${Number(g.member_count||0).toLocaleString()}</b><span>MEMBERS</span></div><div class="card stat"><b>${m.length}</b><span>LOADED MEMBERS</span></div><div class="card stat"><b>${g.channels?.length||0}</b><span>CHANNELS</span></div><div class="card stat"><b>${roles.length}</b><span>MANAGEABLE ROLES</span></div></div><div class="toolbar"><input class="input" id="uid" placeholder="Member ID"><input class="input" id="reason" placeholder="Reason (optional)"><input class="input" id="duration" type="number" min="1" value="60" style="width:110px"><button class="btn danger" onclick="act('ban')">Ban</button><button class="btn danger" onclick="act('kick')">Kick</button><button class="btn" onclick="act('mute')">Mute</button><button class="btn" onclick="act('unmute')">Unmute</button><button class="btn" onclick="act('warn')">Warn</button><button class="btn" onclick="act('unban')">Unban</button><button class="btn" onclick="warnings()">Warning list</button></div><div class="toolbar"><select id="roleSelect"><option value="">Select role…</option>${roles.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="btn success" onclick="act('assign_role')">Give role</button><button class="btn" onclick="act('unassign_role')">Remove role</button></div><div class="toolbar"><select id="nickMember"><option value="">Member for nickname…</option>${m.map(u=>`<option value="${u.id}">${esc(u.display_name)} · ${u.id}</option>`).join('')}</select><input class="input" id="nickname" maxlength="32" placeholder="New nickname"><button class="btn" onclick="nickname()">Update nickname</button></div><div class="tablewrap"><table class="table"><thead><tr><th>User</th><th>ID</th><th>Roles</th><th>Actions</th></tr></thead><tbody>${m.map(u=>`<tr><td>${esc(u.display_name)} ${u.is_admin?'<span class="badge red">ADMIN</span>':''}</td><td>${u.id}</td><td>${(u.roles||[]).map(r=>esc(r.name)).join(', ')||'—'}</td><td><div class="member-actions"><button class="btn small" onclick="fillUser('${u.id}')">Select</button><button class="btn small" onclick="warnDirect('${u.id}')">Warn</button></div></td></tr>`).join('')}</tbody></table></div></div>`}function fillUser(id){document.getElementById('uid').value=id;document.getElementById('nickMember').value=id}async function act(a,forcedId){let id=forcedId||document.getElementById('uid')?.value.trim();if(!id)return alert('Enter/select a member ID');let p={guild_id:selected.id,user_id:id,reason:document.getElementById('reason')?.value||'',duration:Number(document.getElementById('duration')?.value||60)};if(a==='assign_role'||a==='unassign_role'){p.role_id=document.getElementById('roleSelect').value;if(!p.role_id)return alert('Select a role')}try{let x=await getJSON('/api/action/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});alert('✓ '+(typeof x.result==='string'?x.result:'Action completed'));openGuild(selected.id)}catch(e){alert('Action failed: '+e.message)}}function warnDirect(id){fillUser(id);act('warn',id)}async function nickname(){let id=document.getElementById('nickMember').value,n=document.getElementById('nickname').value.trim();if(!id)return alert('Select a member');try{await getJSON('/api/action/nickname',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({guild_id:selected.id,user_id:id,nickname:n,reason:'Moderator nickname update'})});alert('✓ Nickname updated');openGuild(selected.id)}catch(e){alert(e.message)}}async function warnings(){let id=document.getElementById('uid').value.trim();if(!id)return alert('Enter/select a member ID');try{let x=await getJSON('/api/warnings/'+selected.id+'/'+id);document.getElementById('modalTitle').textContent='Warnings for '+id;document.getElementById('modalBody').innerHTML=(x.warnings||[]).length?(x.warnings||[]).map(w=>`<div class="card" style="margin:8px 0"><b>${esc(w.reason||'No reason')}</b><br><small>${esc(w.created_at||'Unknown date')} · Moderator ${esc(w.moderator_id||'Unknown')}</small></div>`).join(''):'<p>No warnings recorded.</p>';document.getElementById('modal').classList.add('show')}catch(e){alert(e.message)}}function closeModal(){document.getElementById('modal').classList.remove('show')}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
