<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderator — Anion</title><link rel="stylesheet" href="/static/styles.css"></head><body class="dash"><header class="dashnav"><a class="brand" href="/"><img src="/static/anion-logo.png" alt="Anion"></a><a class="btn small" href="/logout">Logout</a></header><main class="dashmain"><div class="card"><div class="kicker">MODERATOR CONTROL</div><h1>Server moderation</h1><p class="muted">Only servers where your real Discord account has moderation/admin permissions are actionable.</p></div><div id="servers" class="servergrid"></div><div id="panel" style="margin-top:18px"></div></main><script>
let guilds=[],selected=null;async function load(){let m=await (await fetch('/api/me')).json();let x=await (await fetch('/api/guilds')).json();guilds=(x.guilds||[]).filter(g=>g.is_admin||g.is_owner);document.getElementById('servers').innerHTML=guilds.map(s=>`<article class="card server" onclick="openGuild('${s.id}')"><img src="${s.icon||'/static/planet.jpg'}"><div class="meta"><b>${esc(s.name)}</b><span class="badge red">${s.is_owner?'Owner':'Admin'}</span><span class="badge">${s.member_count.toLocaleString()} members</span></div></article>`).join('')||'<div class="empty">No administrated mutual servers found.</div>'}async function openGuild(id){selected=(await (await fetch('/api/guild/'+id)).json()).guild;render()}function render(){let g=selected;let members=(g.members||[]).slice(0,100);document.getElementById('panel').innerHTML=`<div class="card"><div class="sectionhead"><div><div class="kicker">${esc(g.name)}</div><h2>MODERATION</h2></div></div><div class="toolbar"><input id="uid" placeholder="Member ID"><input id="reason" placeholder="Reason (optional)"><input id="duration" type="number" min="1" value="60" placeholder="Minutes"><button class="btn small danger" onclick="act('ban')">Ban</button><button class="btn small danger" onclick="act('kick')">Kick</button><button class="btn small" onclick="act('mute')">Mute</button><button class="btn small" onclick="act('unmute')">Unmute</button><button class="btn small" onclick="act('warn')">Warn</button><button class="btn small" onclick="act('unban')">Unban by ID</button><button class="btn small" onclick="warnings()">Warning list</button><select id="roleSelect"><option value="">Role...</option>${(g.roles||[]).filter(r=>!r.managed&&r.name!='@everyone').map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="btn small success" onclick="act('assign_role')">Give role</button><button class="btn small" onclick="act('unassign_role')">Remove role</button></div><div class="tablewrap"><table class="table"><thead><tr><th>User</th><th>ID</th><th>Roles</th></tr></thead><tbody>${members.map(m=>`<tr><td>${esc(m.display_name)}${m.is_admin?' <span class="badge red">ADMIN</span>':''}</td><td>${m.id}</td><td>${(m.roles||[]).map(r=>esc(r.name)).join(', ')||'—'}</td></tr>`).join('')}</tbody></table></div></div>`}async function act(a){let id=document.getElementById('uid').value.trim();if(!id)return alert('Enter a member/user ID');let p={guild_id:selected.id,user_id:id,reason:document.getElementById('reason').value,duration:Number(document.getElementById('duration').value||60)};if(a==='assign_role'||a==='unassign_role')p.role_id=document.getElementById('roleSelect').value;if((a==='assign_role'||a==='unassign_role')&&!p.role_id)return alert('Select a role');let r=await fetch('/api/action/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let x=await r.json();alert(x.ok?'Action completed':(x.error||'Action failed'));if(x.ok)openGuild(selected.id)}async function warnings(){let id=document.getElementById('uid').value.trim();if(!id)return alert('Enter a member ID');let r=await fetch('/api/warnings/'+selected.id+'/'+id);let x=await r.json();if(!x.ok)return alert(x.error||'Could not load warnings');alert((x.warnings||[]).map(w=>`${w.created_at}\n${w.reason}\nModerator: ${w.moderator_id}`).join('\n\n')||'No warnings.')}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load()</script></body></html>
