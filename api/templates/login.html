
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EDITH Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05070a;
            color: #f5f7fa;
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 82% 15%, rgba(88, 101, 242, 0.10), transparent 25%),
                radial-gradient(circle at 15% 40%, rgba(88, 101, 242, 0.045), transparent 32%),
                #05070a;
        }

        .container {
            background: #0c1016;
            padding: 48px 40px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(88, 101, 242, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-mark {
            width: 48px;
            height: 38px;
            margin: 0 auto 12px;
            clip-path: polygon(50% 0, 100% 100%, 78% 100%, 66% 64%, 48% 100%, 25% 100%);
            background: linear-gradient(135deg, #5865F2, #7b0815);
            filter: drop-shadow(0 0 12px rgba(88, 101, 242, 0.6));
        }

        .brand h1 {
            font: 800 24px 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        .brand h1 span {
            color: #5865F2;
        }

        .brand p {
            font-size: 12px;
            color: #9ca5b3;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #9ca5b3;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #f5f7fa;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: 0.25s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #5865F2;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.08);
            background: rgba(255, 255, 255, 0.05);
        }

        .form-group input::placeholder {
            color: #4a5260;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #5865F2;
            color: #fff;
            font: 700 14px 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 4px;
        }

        .btn:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(88, 101, 242, 0.3);
        }

        .flash {
            background: rgba(255, 50, 50, 0.08);
            border: 1px solid rgba(255, 50, 50, 0.15);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 12px;
            color: #ff6b6b;
        }

        .flash.success {
            background: rgba(67, 181, 129, 0.08);
            border-color: rgba(67, 181, 129, 0.15);
            color: #43b581;
        }

        .flash.warning {
            background: rgba(250, 166, 26, 0.08);
            border-color: rgba(250, 166, 26, 0.15);
            color: #faa61a;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: #4a5260;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
            line-height: 1.8;
        }

        .footer code {
            background: #0c1016;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: #5865F2;
            border: 1px solid rgba(88, 101, 242, 0.1);
        }

        .footer a {
            color: #5865F2;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <div class="brand-mark"></div>
            <h1>EDITH<span>Bot</span></h1>
            <p>Secure Login</p>
        </div>

        <div class="flash warning">Please enter your credentials to access the dashboard.</div>

        <form method="POST" action="/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Login →</button>
        </form>

        <div class="footer">
            <p>Don't have an account? Verify in Discord using <code>/verify</code></p>
            <p>Credentials are generated automatically upon verification</p>
        </div>
    </div>
</body>
</html>
