<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Anion</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/styles.css"></head><body><div class="loginwrap"><div class="terminal"><div class="terminalbar">anion-control / secure-session</div><div class="terminalbody"><div class="eyebrow">AUTHENTICATION</div><h1>Sign in to Anion</h1><p>Use the credentials issued by the bot. Your access level is resolved from the credential record and real Discord permissions.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><div class="field"><label>USERNAME</label><input name="username" autocomplete="username" required autofocus placeholder="user_... or superadmin"></div><div class="field"><label>PASSWORD</label><input name="password" type="password" autocomplete="current-password" required placeholder="••••••••••••"></div><button class="btn btn-red" style="width:100%" type="submit">Authenticate →</button></form><p style="margin-top:22px;font-family:monospace">status: <span style="color:#61e6a8">ready</span></p></div></div></div></body></html>
