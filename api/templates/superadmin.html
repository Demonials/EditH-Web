<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Admin — EditH</title><style>
:root{--bg:#03070c;--panel:#071019;--red:#ff2038;--text:#f4f7fb;--muted:#8f9baa;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}a{text-decoration:none;color:inherit}.dash{min-height:100vh;background:radial-gradient(circle at 80% 0%,rgba(255,32,56,.1),transparent 35%),#03070c}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10;background:rgba(3,7,12,.9);backdrop-filter:blur(15px)}.brand img{width:190px;height:55px;object-fit:contain;object-position:left}.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#0b121a;color:#fff;cursor:pointer}.btn:hover{border-color:rgba(255,32,56,.7)}.red{background:#e9152d;border-color:#ff3147}.danger{color:#ff8793;border-color:rgba(255,32,56,.35)}.success{color:#71e4ad;border-color:rgba(50,210,130,.35)}.small{font-size:11px;padding:7px 10px}.main{width:min(1400px,calc(100% - 28px));margin:auto;padding:28px 0}.card{background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));border:1px solid var(--line);border-radius:16px;padding:21px}.kicker{font-size:10px;font-weight:900;letter-spacing:.2em;color:var(--red)}h1,h2{margin:7px 0}.muted{color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat b{display:block;font-size:25px}.stat span{font-size:10px;color:#77828f}.servers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.server{display:flex;gap:12px;align-items:center;cursor:pointer}.server:hover{border-color:rgba(255,32,56,.6);transform:translateY(-2px)}.server img{width:55px;height:55px;border-radius:15px;object-fit:cover;background:#111}.meta{min-width:0}.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;margin:4px 4px 0 0;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.06);font-size:9px;color:#aab3bd}.badge.red{background:rgba(255,32,56,.12);color:#ff7480}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.input,.toolbar select,.toolbar textarea{background:#070d13;color:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:0}.input:focus,.toolbar select:focus,.toolbar textarea:focus{border-color:var(--red)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:10px}.table th{font-size:9px;color:#75808c;text-transform:uppercase;letter-spacing:.08em}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty{text-align:center;padding:45px;color:#697581}.serverhead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.dangerzone{border-color:rgba(255,32,56,.25)}@media(max-width:1050px){.servers{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:560px){.nav{padding:0 14px}.brand img{width:150px}.servers{grid-template-columns:1fr}.main{width:min(100% - 20px,1400px)}}
</style></head><body class="dash"><header class="nav"><a class="brand" href="/"><img src="/static/anion-logo.png" alt="EditH"></a><div><span class="badge red">SUPER ADMIN</span> <a class="btn small" href="/logout">Logout</a></div></header><main class="main"><section class="card"><div class="kicker">GLOBAL CONTROL</div><h1>EditH Super Admin</h1><p class="muted">Live list of every Discord server where EditH is installed. Select any server to inspect and control it. Super Admin authorization is enforced by Railway.</p></section><section class="stats"><div class="card stat"><b id="count">—</b><span>EDIT H SERVERS</span></div><div class="card stat"><b id="members">—</b><span>TOTAL MEMBERS</span></div><div class="card stat"><b id="channels">—</b><span>CHANNELS</span></div><div class="card stat"><b>LIVE</b><span>DISCORD SOURCE</span></div></section><section class="card"><div class="kicker">ALL SERVERS</div><h2>Choose a server</h2><div id="servers" class="servers"></div></section><section id="panel" style="margin-top:15px"></section></main><script>
let selected=null;async function getJSON(url,opts){let r=await fetch(url,opts);let x=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw new Error(x.error||x.detail||('HTTP '+r.status));return x}async function load(){try{let x=await getJSON('/api/superadmin/guilds'),g=x.guilds||[];document.getElementById('count').textContent=g.length;document.getElementById('members').textContent=g.reduce((n,s)=>n+(Number(s.member_count)||0),0).toLocaleString();document.getElementById('channels').textContent=g.reduce((n,s)=>n+(Number(s.channels)||0),0).toLocaleString();document.getElementById('servers').innerHTML=g.map(s=>`<article class="card server" onclick="openGuild('${s.id}')"><img src="${s.icon||'/static/planet.jpg'}"><div class="meta"><b>${esc(s.name)}</b><span class="badge red">INSTALLED</span><span class="badge">${Number(s.member_count||0).toLocaleString()} members</span><span class="badge">${s.channels||0} channels</span></div></article>`).join('')||'<div class="empty">EditH is not installed in any server.</div>'}catch(e){document.getElementById('servers').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}async function openGuild(id){try{selected=(await getJSON('/api/guild/'+id)).guild;render()}catch(e){alert(e.message)}}function render(){let g=selected,m=g.members||[],roles=(g.roles||[]).filter(r=>!r.managed&&r.name!='@everyone'),channels=g.channels||[];document.getElementById('panel').innerHTML=`<section class="card"><div class="serverhead"><div><div class="kicker">SELECTED SERVER</div><h2>${esc(g.name)}</h2><p class="muted">Owner: ${esc(g.owner_id||'Unknown')} · Created: ${esc((g.created_at||'').slice(0,10))}</p></div><a class="btn red" target="_blank" href="${inviteURL(g.id)}">Invite EditH</a></div><div class="stats"><div class="card stat"><b>${Number(g.member_count||0).toLocaleString()}</b><span>MEMBERS</span></div><div class="card stat"><b>${m.length}</b><span>LOADED USERS</span></div><div class="card stat"><b>${channels.length}</b><span>CHANNELS</span></div><div class="card stat"><b>${roles.length}</b><span>ROLES</span></div></div><div class="grid2"><div class="card"><div class="kicker">MODERATION</div><div class="toolbar"><input class="input" id="uid" placeholder="User ID"><input class="input" id="reason" placeholder="Reason"><input class="input" id="duration" type="number" value="60" min="1" style="width:95px"></div><div class="toolbar"><button class="btn danger" onclick="act('ban')">Ban</button><button class="btn danger" onclick="act('kick')">Kick</button><button class="btn" onclick="act('mute')">Mute</button><button class="btn" onclick="act('unmute')">Unmute</button><button class="btn" onclick="act('warn')">Warn</button><button class="btn" onclick="act('unban')">Unban</button><button class="btn danger" onclick="act('mute_all')">Mute All</button><button class="btn" onclick="warnings()">Warnings</button></div><div class="toolbar"><select id="roleSelect"><option value="">Select role…</option>${roles.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="btn success" onclick="act('assign_role')">Give role</button><button class="btn" onclick="act('unassign_role')">Remove role</button></div></div><div class="card"><div class="kicker">MESSAGING</div><textarea id="message" rows="4" style="width:100%;resize:vertical" class="input" placeholder="Message"></textarea><div class="toolbar"><select id="messageChannel"><option value="">Announcement channel…</option>${channels.filter(c=>c.type==='text').map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button class="btn" onclick="announcement()">Send announcement</button></div><div class="toolbar"><input class="input" id="dmUser" placeholder="DM user ID"><button class="btn" onclick="sendDM()">Send DM</button></div></div></div><div class="grid2" style="margin-top:12px"><div class="card"><div class="kicker">ROLES</div><div class="toolbar"><input class="input" id="roleName" placeholder="New role name"><input class="input" id="roleColor" value="#ff2038" style="width:105px"><button class="btn success" onclick="createRole()">Create role</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Role</th><th>Position</th><th>Members</th><th>Action</th></tr></thead><tbody>${roles.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.position}</td><td>${r.members||0}</td><td><button class="btn small danger" onclick="quick('delete_role',{role_id:'${r.id}'})">Delete</button></td></tr>`).join('')||'<tr><td colspan="4">No manageable roles</td></tr>'}</tbody></table></div></div><div class="card"><div class="kicker">CHANNELS</div><div class="toolbar"><input class="input" id="channelName" placeholder="new-channel"><select id="channelType"><option value="text">Text</option><option value="voice">Voice</option></select><button class="btn success" onclick="createChannel()">Create channel</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Channel</th><th>Type</th><th>Position</th><th>Action</th></tr></thead><tbody>${channels.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.type)}</td><td>${c.position}</td><td><button class="btn small danger" onclick="quick('delete_channel',{channel_id:'${c.id}'})">Delete</button></td></tr>`).join('')}</tbody></table></div></div></div><div class="card" style="margin-top:12px"><div class="kicker">MEMBERS</div><div class="toolbar"><input class="input" id="memberSearch" placeholder="Search name or ID" oninput="filterMembers()"></div><div class="tablewrap"><table class="table"><thead><tr><th>User</th><th>ID</th><th>Roles</th><th>Admin</th><th>Action</th></tr></thead><tbody id="memberRows">${memberRows(m)}</tbody></table></div></div></section>`}function memberRows(m){return m.map(u=>`<tr data-search="${esc((u.display_name+' '+u.id).toLowerCase())}"><td>${esc(u.display_name)}</td><td>${u.id}</td><td>${(u.roles||[]).map(r=>esc(r.name)).join(', ')||'—'}</td><td>${u.is_admin?'YES':'NO'}</td><td><button class="btn small" onclick="selectUser('${u.id}')">Select</button></td></tr>`).join('')}function filterMembers(){let q=document.getElementById('memberSearch').value.toLowerCase();document.querySelectorAll('#memberRows tr').forEach(r=>r.style.display=(r.dataset.search||'').includes(q)?'':'none')}function selectUser(id){document.getElementById('uid').value=id;document.getElementById('dmUser').value=id;window.scrollTo({top:document.getElementById('panel').offsetTop,behavior:'smooth'})}async function act(a,extra={}){let p={guild_id:selected.id,reason:document.getElementById('reason')?.value||'Super Admin control panel',...extra};if(['ban','kick','mute','unmute','warn','unban','assign_role','unassign_role'].includes(a)||a==='mute_all')p.user_id=document.getElementById('uid')?.value.trim();if(['ban','kick','mute','unmute','warn','mute_all'].includes(a))p.duration=Number(document.getElementById('duration')?.value||60);if(a==='assign_role'||a==='unassign_role'){p.role_id=document.getElementById('roleSelect').value;if(!p.role_id)return alert('Select a role')}try{let x=await getJSON('/api/action/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});alert('✓ '+(typeof x.result==='string'?x.result:'Action completed'));openGuild(selected.id)}catch(e){alert('Action failed: '+e.message)}}async function quick(a,extra){await act(a,extra)}async function createRole(){let n=document.getElementById('roleName').value.trim();if(!n)return alert('Enter a role name');await act('create_role',{name:n,color:document.getElementById('roleColor').value})}async function createChannel(){let n=document.getElementById('channelName').value.trim();if(!n)return alert('Enter a channel name');await act('create_channel',{name:n,type:document.getElementById('channelType').value})}async function announcement(){let channel=document.getElementById('messageChannel').value,msg=document.getElementById('message').value.trim();if(!channel||!msg)return alert('Select a text channel and enter a message');await act('announcement',{channel_id:channel,message:msg})}async function sendDM(){let id=document.getElementById('dmUser').value.trim(),msg=document.getElementById('message').value.trim();if(!id||!msg)return alert('Enter a user ID and message');await act('dm',{user_id:id,message:msg})}async function warnings(){let id=document.getElementById('uid').value.trim();if(!id)return alert('Enter a user ID');try{let x=await getJSON('/api/warnings/'+selected.id+'/'+id);alert((x.warnings||[]).map(w=>`${w.created_at}\n${w.reason}\nModerator: ${w.moderator_id}`).join('\n\n')||'No warnings.')}catch(e){alert(e.message)}}function inviteURL(gid){return `https://discord.com/oauth2/authorize?client_id=${encodeURIComponent('{{ config_client_id|default("") }}')}&scope=bot%20applications.commands&permissions=8&guild_id=${encodeURIComponent(gid)}`}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
