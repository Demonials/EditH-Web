<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superadmin — Anion</title><link rel="stylesheet" href="/static/styles.css"></head><body class="dash"><header class="dashnav"><a class="brand" href="/"><img src="/static/anion-logo.png" alt="Anion"></a><a class="btn small" href="/logout">Logout</a></header><main class="dashmain"><div class="card"><div class="kicker">SUPERADMIN</div><h1>Global Anion control</h1><p class="muted">Global access to every guild where the bot is currently installed. Every action is executed by the Railway bot and rechecked against Discord permissions.</p></div><div class="dashstats"><div class="dashstat"><b id="count">—</b><span>BOT SERVERS</span></div><div class="dashstat"><b>GLOBAL</b><span>ACCESS</span></div><div class="dashstat"><b>LIVE</b><span>DISCORD DATA</span></div><div class="dashstat"><b>API</b><span>RAILWAY BACKEND</span></div></div><div id="servers" class="servergrid"></div><div id="panel" style="margin-top:18px"></div></main><script>
let selected=null;async function load(){let x=await (await fetch('/api/superadmin/guilds')).json();let g=x.guilds||[];document.getElementById('count').textContent=g.length;document.getElementById('servers').innerHTML=g.map(s=>`<article class="card server" onclick="openGuild('${s.id}')"><img src="${s.icon||'/static/planet.jpg'}"><div class="meta"><b>${esc(s.name)}</b><span class="badge red">GLOBAL</span><span class="badge">${s.member_count.toLocaleString()} members</span></div></article>`).join('')||'<div class="empty">Bot is not in any servers.</div>'}async function openGuild(id){selected=(await (await fetch('/api/guild/'+id)).json()).guild;render()}function render(){let g=selected;let roles=g.roles||[],channels=g.channels||[],members=g.members||[];document.getElementById('panel').innerHTML=`<div class="card"><div class="kicker">${esc(g.name)}</div><h2>GLOBAL SERVER MANAGEMENT</h2><div class="toolbar"><input id="uid" placeholder="User ID"><input id="reason" placeholder="Reason"><input id="duration" type="number" value="60" min="1"><button class="btn small danger" onclick="act('ban')">Ban</button><button class="btn small danger" onclick="act('kick')">Kick</button><button class="btn small" onclick="act('mute')">Mute</button><button class="btn small" onclick="act('unmute')">Unmute</button><button class="btn small" onclick="act('warn')">Warn</button><button class="btn small danger" onclick="act('mute_all')">Mute All</button><select id="roleSelect"><option value="">Role...</option>${roles.filter(r=>!r.managed&&r.name!='@everyone').map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="btn small success" onclick="act('assign_role')">Give role</button><button class="btn small" onclick="act('unassign_role')">Remove role</button></div><div class="toolbar"><input id="roleName" placeholder="New role name"><input id="roleColor" value="#ff2038"><button class="btn small" onclick="act('create_role')">Create Role</button><input id="channelName" placeholder="new-channel"><select id="channelType"><option value="text">Text</option><option value="voice">Voice</option></select><button class="btn small" onclick="act('create_channel')">Create Channel</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Role / Position</th><th>Members</th><th>Action</th><th>Channel</th><th>Action</th></tr></thead><tbody>${roles.filter(r=>!r.managed&&r.name!='@everyone').map(r=>`<tr><td>${esc(r.name)} · ${r.position}</td><td>${r.members||0}</td><td><button class="btn small danger" onclick="quick('delete_role', {role_id:'${r.id}'})">Delete</button></td><td>—</td><td>—</td></tr>`).join('')}${channels.map(c=>`<tr><td>—</td><td>—</td><td>—</td><td>${esc(c.name)} · ${esc(c.type)}</td><td><button class="btn small danger" onclick="quick('delete_channel',{channel_id:'${c.id}'})">Delete</button></td></tr>`).join('')}</tbody></table></div><div class="tablewrap" style="margin-top:15px"><table class="table"><thead><tr><th>Members</th><th>Roles</th><th>Channels</th></tr></thead><tbody><tr><td>${members.length}</td><td>${roles.length}</td><td>${channels.length}</td></tr></tbody></table></div></div>`}async function act(a){let p={guild_id:selected.id,reason:document.getElementById('reason')?.value||''};if(['ban','kick','mute','unmute','warn','assign_role','unassign_role'].includes(a)||a==='mute_all'){p.user_id=document.getElementById('uid')?.value.trim();p.duration=Number(document.getElementById('duration')?.value||60)}if(a==='assign_role'||a==='unassign_role')p.role_id=document.getElementById('roleSelect').value;if((a==='assign_role'||a==='unassign_role')&&!p.role_id)return alert('Select a role');if(a==='create_role'){p.name=document.getElementById('roleName').value;p.color=document.getElementById('roleColor').value}if(a==='create_channel'){p.name=document.getElementById('channelName').value;p.type=document.getElementById('channelType').value}let r=await fetch('/api/action/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let x=await r.json();alert(x.ok?'Action completed':(x.error||'Action failed'));if(x.ok)openGuild(selected.id)}async function quick(a,extra){let p=Object.assign({guild_id:selected.id,reason:'Superadmin control panel'},extra);let r=await fetch('/api/action/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let x=await r.json();alert(x.ok?'Action completed':(x.error||'Action failed'));if(x.ok)openGuild(selected.id)}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load()</script></body></html>
